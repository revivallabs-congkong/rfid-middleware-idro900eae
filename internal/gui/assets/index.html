<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CongKong RFID 미들웨어</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--line:#e3e3e6;--txt:#1d1d22;--sub:#6b6b74;
--green:#18a34a;--yellow:#d97706;--red:#dc2626;--gray:#9ca3af;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#dot{width:18px;height:18px;border-radius:50%;background:var(--gray);flex:none}
#dot.green{background:var(--green)}#dot.yellow{background:var(--yellow)}#dot.red{background:var(--red)}
#headline{font-weight:700;font-size:16px;flex:1}
.badge{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.ind{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:16px;padding:3px 10px;white-space:nowrap}
.ind .idot{width:9px;height:9px;border-radius:50%;background:var(--gray);flex:none}
.ind.on{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.ind.on .idot{background:var(--green)}
.ind.off{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.ind.off .idot{background:var(--red)}
.ind.wait{background:#fffbeb;border-color:#fde68a;color:#92400e}
.ind.wait .idot{background:var(--yellow)}
main{max-width:960px;margin:0 auto;padding:16px 20px 40px}
h2{font-size:14px;color:var(--sub);margin:22px 0 8px}
#cfgerr{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px;border-radius:8px;display:none;white-space:pre-wrap}
#readers{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .rid{font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card .sess{color:var(--sub);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin-top:8px}
.kv dt{color:var(--sub)}.kv dd{margin:0}
.state-ok{color:var(--green)}.state-warn{color:var(--yellow)}.state-bad{color:var(--red)}
.action{margin-top:8px;font-size:12.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:6px 8px}
.cardbtns{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
button:hover{background:#f0f0f2}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{opacity:.9}
#ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#ctrlMsg{display:none}
.banner{padding:10px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.banner.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.banner.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
#catbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:10px;overflow:hidden;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
th{background:#fafafa;color:var(--sub);font-weight:600}
tr.selectable:hover{background:#f0f6ff;cursor:pointer}
#logbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
select,input[type=text],input[type=number]{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
#cfgView table{margin-top:4px}
#cfgView .fld{display:grid;grid-template-columns:140px 1fr;gap:6px;align-items:center;margin:4px 0;font-size:13px}
#cfgView .fld label{color:var(--sub)}
#cfgView input{width:100%}
.rdrRow{display:flex;gap:6px;margin:4px 0;align-items:center}
.rdrRow input{flex:1}
#logs{background:#101014;color:#d6d6dd;border-radius:10px;padding:10px;height:320px;overflow-y:auto;
font:12px/1.55 Consolas,'D2Coding',monospace;white-space:pre-wrap;word-break:break-all}
.lw{color:#facc15}.le{color:#f87171}.ld{color:#6b7280}
#queue{font-size:13px;color:var(--sub);margin-top:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10}
#modal .box{background:var(--card);border-radius:12px;padding:20px;max-width:420px;width:92%}
#modal h3{margin:0 0 10px;font-size:15px}
#modal p{font-size:13.5px;color:var(--sub);white-space:pre-wrap}
#modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<header>
  <div id="dot"></div>
  <div id="headline">연결 중…</div>
  <span class="ind" id="indCollect"><span class="idot"></span><span class="itxt">수집</span></span>
  <span class="ind" id="indNet"><span class="idot"></span><span class="itxt">인터넷</span></span>
  <span class="badge" id="mode">-</span>
  <span class="badge" id="ver">-</span>
</header>
<main>
  <div id="cfgerr"></div>
  <h2>리더</h2>
  <div id="readers"></div>
  <div id="queue"></div>

  <h2>수집 제어</h2>
  <div id="ctrl"></div>

  <h2>세션 카탈로그</h2>
  <div id="catBanners"></div>
  <div id="catbar"></div>
  <div id="sessions"></div>

  <h2>설정 <button id="cfgEdit" style="font-size:12px">편집</button></h2>
  <div id="cfgView"></div>

  <h2>실시간 로그</h2>
  <div id="logbar">
    <select id="fLevel"><option value="">모든 레벨</option><option>debug</option><option>info</option><option>warn</option><option>error</option></select>
    <input type="text" id="fReader" placeholder="리더 id 필터">
    <input type="text" id="fEvent" placeholder="이벤트명 필터">
    <button id="pause">일시정지</button>
  </div>
  <div id="logs"></div>
</main>
<div id="modal"><div class="box">
  <h3 id="mTitle"></h3>
  <p id="mBody"></p>
  <div class="btns" id="mBtns"></div>
</div></div>
<script src="app.js"></script>
</body>
</html>
